<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@500;700;800;900&family=Cairo:wght@800;900&display=block" rel="stylesheet">
<style>
:root{--ink:#0B1626;--ink2:#14243C;--gold:#D9AE55;--gold2:#F3D58A;--cream:#F6EBD3;--wa:#25D366}
*{box-sizing:border-box}html,body{margin:0}
.p{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Tajawal',sans-serif;color:var(--cream);
 background:radial-gradient(900px 600px at 50% 36%,#1E3556 0%,var(--ink) 65%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(217,174,85,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(217,174,85,.07) 1px,transparent 1px);background-size:54px 54px;
 mask-image:radial-gradient(circle at 50% 35%,#000 20%,transparent 70%)}
.top{position:absolute;top:48px;right:56px;left:56px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:16px}
.brand .n{font-family:'Aref Ruqaa';font-size:54px;line-height:1}
.chip{border:2px solid var(--gold);color:var(--gold);border-radius:40px;padding:10px 26px;font-weight:700;font-size:26px}
.hero{position:absolute;top:130px;left:0;right:0;display:flex;justify-content:center}
.text{position:absolute;top:660px;right:64px;left:64px;text-align:center}
.kick{display:inline-block;background:rgba(37,211,102,.12);color:var(--wa);border:1.5px solid rgba(37,211,102,.5);padding:8px 22px;border-radius:30px;font-weight:700;font-size:26px;margin-bottom:16px}
h1{font-family:'Cairo';font-weight:900;font-size:62px;line-height:1.45;margin:0}
h1 .hl{color:var(--ink);background:linear-gradient(90deg,var(--gold2),var(--gold));padding:0 18px;border-radius:14px;white-space:nowrap;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{font-size:30px;line-height:1.6;font-weight:500;color:#D4DCE8;margin:26px auto 0;max-width:900px}
.sub b{color:var(--gold2);font-weight:800}
.cta{position:absolute;bottom:56px;right:56px;left:56px;display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.04);border:1.5px solid rgba(217,174,85,.45);border-radius:26px;padding:22px 30px}
.cta .t{flex:1;font-size:29px;line-height:1.5;font-weight:700}
.cta .t span{color:var(--gold2)}
.wa{width:74px;height:74px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;flex:none}
</style></head><body>
<div class="p" id="v">
<div class="grid"></div>
<div class="top">
 <div class="brand">
  <svg width="58" height="70" viewBox="0 0 200 240"><defs><linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3D58A"/><stop offset="1" stop-color="#9C7227"/></linearGradient></defs>
  <rect x="66" y="8" width="68" height="34" rx="8" fill="url(#g0)"/><path d="M100 232 L46 128 Q38 104 54 82 L66 50 H134 L146 82 Q162 104 154 128 Z" fill="url(#g0)"/><path d="M100 232 V128" stroke="#0B1626" stroke-width="6"/><circle cx="100" cy="118" r="13" fill="#0B1626"/><circle cx="100" cy="118" r="5" fill="#25D366"/></svg>
  <div class="n">بقلم دينا</div>
 </div>
 <div class="chip">ذكاء اصطناعي × ريادة أعمال</div>
</div>

<div class="hero">
<svg width="900" height="520" viewBox="0 0 900 520">
 <defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3D58A"/><stop offset=".55" stop-color="#D9AE55"/><stop offset="1" stop-color="#9C7227"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#D9AE55" stop-opacity=".45"/><stop offset="1" stop-color="#D9AE55" stop-opacity="0"/></radialGradient>
 </defs>
 <circle cx="450" cy="250" r="250" fill="url(#glow)"/>
 <circle cx="450" cy="250" r="205" fill="none" stroke="#D9AE55" stroke-opacity=".25" stroke-width="2" stroke-dasharray="6 10"/>
 <!-- circuits -->
 <g stroke="#D9AE55" stroke-width="3" fill="none" stroke-opacity=".75">
  <path d="M395 250 H260 V120 H175"/><path d="M505 250 H640 V120 H725"/>
  <path d="M400 320 H230 V400 H175"/><path d="M500 320 H670 V400 H725"/>
 </g>
 <!-- agent nodes -->
 <g font-family="Tajawal" font-weight="700" font-size="22" fill="#F6EBD3" text-anchor="middle">
  <g transform="translate(130,120)"><circle r="46" fill="#14243C" stroke="#25D366" stroke-width="3"/>
   <path d="M-18 -12 h36 a6 6 0 0 1 6 6 v18 a6 6 0 0 1 -6 6 h-20 l-10 9 v-9 h-6 a6 6 0 0 1 -6 -6 v-18 a6 6 0 0 1 6 -6z" fill="none" stroke="#25D366" stroke-width="3.5"/>
   <text y="78">خدمة العملاء</text></g>
  <g transform="translate(770,120)"><circle r="46" fill="#14243C" stroke="#25D366" stroke-width="3"/>
   <path d="M-20 16 V-2 M-6 16 V-14 M8 16 V4 M22 16 V-20" stroke="#25D366" stroke-width="5" stroke-linecap="round"/>
   <text y="78">التسويق والمبيعات</text></g>
  <g transform="translate(130,400)"><circle r="46" fill="#14243C" stroke="#25D366" stroke-width="3"/>
   <rect x="-20" y="-14" width="40" height="28" rx="4" fill="none" stroke="#25D366" stroke-width="3.5"/><path d="M-20 -12 L0 4 L20 -12" fill="none" stroke="#25D366" stroke-width="3.5"/>
   <text y="78">المراسلات</text></g>
  <g transform="translate(770,400)"><circle r="46" fill="#14243C" stroke="#25D366" stroke-width="3"/>
   <circle r="11" fill="none" stroke="#25D366" stroke-width="4"/>
   <g stroke="#25D366" stroke-width="6" stroke-linecap="round"><path d="M0 -24v6M0 18v6M-24 0h6M18 0h6M-17 -17l4 4M13 13l4 4M-17 17l4 -4M13 -13l4 -4"/></g>
   <text y="78">العمليات</text></g>
 </g>
 <g fill="#25D366"><circle cx="260" cy="250" r="6"/><circle cx="640" cy="250" r="6"/><circle cx="230" cy="320" r="6"/><circle cx="670" cy="320" r="6"/></g>
 <!-- the pen nib -->
 <g transform="translate(330,40) scale(1.2)">
  <rect x="66" y="8" width="68" height="34" rx="8" fill="url(#g)"/>
  <path d="M100 232 L46 128 Q38 104 54 82 L66 50 H134 L146 82 Q162 104 154 128 Z" fill="url(#g)"/>
  <path d="M100 232 V128" stroke="#0B1626" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="118" r="13" fill="#0B1626"/><circle cx="100" cy="118" r="5" fill="#25D366"/>
  <text x="100" y="185" text-anchor="middle" font-family="Cairo" font-weight="900" font-size="30" fill="#0B1626" opacity=".0">AI</text>
 </g>
 <text x="450" y="512" text-anchor="middle" font-family="Cairo" font-weight="900" font-size="30" fill="#D9AE55" letter-spacing="6">AI AGENTS</text>
</svg>
</div>

<div class="text">
 <div class="kick">دليل مجاني</div>
 <h1>الدليل الكامل لتأسيس وإدارة<br>شركة كاملة <span class="hl">«بدون موظفين»!</span></h1>
 <p class="sub">كيف تبني أعمالاً تعتمد كلياً على <b>وكلاء الذكاء الاصطناعي</b>: مهام ومحادثات ومشاريع تُدار ذاتياً على مدار الساعة، دون تدخّل بشري.</p>
</div>

<div class="cta">
 <div class="wa"><svg width="44" height="44" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg></div>
 <div class="t">احفظ المنشور الآن 🔖 والدليل كاملاً في قناة <span>«بقلم دينا»</span> على واتساب</div>
</div>
</div>
</body></html>
