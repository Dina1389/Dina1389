<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Space+Mono:wght@700&display=block" rel="stylesheet">
<style>
:root{--bg:#F8F0E7;--line:rgba(196,110,76,.09);--accent:#D97757;--accent2:#B5532F;--brown:#3A2A22;--muted:#7A5E50}
*{box-sizing:border-box}html,body{margin:0}
.p{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Cairo',sans-serif;color:var(--brown);background:var(--bg);
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px}
.p:before{content:"";position:absolute;top:44px;left:44px;right:44px;height:2px;background:rgba(58,42,34,.12)}
.logo{position:absolute;top:78px;left:50%;transform:translateX(-50%);width:250px;height:250px;filter:drop-shadow(0 14px 22px rgba(58,42,34,.22))}
.logo img{width:100%;height:100%}
.card{position:absolute;top:385px;left:90px;right:90px;background:#fff;border-radius:44px;padding:44px 56px 46px;box-shadow:0 10px 0 rgba(58,42,34,.06),0 2px 0 rgba(58,42,34,.08)}
.card:before{content:"";position:absolute;top:-30px;left:50%;transform:translateX(-50%);border:32px solid transparent;border-top:0;border-bottom:32px solid #fff}
.new{font-weight:800;font-size:36px;color:var(--muted)}
.big{font-family:'Space Mono',monospace;font-weight:700;font-size:112px;color:var(--accent2);direction:ltr;text-align:center;line-height:1.1;margin:6px 0 10px}
.h{font-weight:900;font-size:52px;line-height:1.45;text-align:center;margin:0}
.h span{color:var(--accent)}
.pill{position:absolute;top:905px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-weight:800;font-size:36px;padding:10px 40px;border-radius:18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 rgba(181,83,47,.25);white-space:nowrap}
.sub{position:absolute;top:1010px;left:100px;right:100px;text-align:center;font-weight:600;font-size:31px;line-height:1.6;color:var(--muted)}
.sub b{color:var(--brown);font-weight:800}
.cta{position:absolute;bottom:62px;left:0;right:0;text-align:center;font-weight:900;font-size:70px;line-height:1.2}
.cta span{color:var(--accent)}
.cta small{display:block;font-size:28px;font-weight:700;color:var(--muted);margin-top:8px}
</style></head><body>
<div class="p" id="v">
 <div class="logo"><img src="logo.png"></div>
 <div class="card">
  <div class="new">جديد!!</div>
  <div class="big">AI Agents</div>
  <p class="h">الدليل الكامل لتأسيس وإدارة<br>شركة كاملة <span>«بدون موظفين»!</span></p>
 </div>
 <div class="pill"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>دليل مجاني</div>
 <p class="sub">كيف تبني أعمالاً تعتمد كلياً على <b>وكلاء الذكاء الاصطناعي</b>: مهام ومحادثات ومشاريع تُدار ذاتياً على مدار الساعة.</p>
 <div class="cta">احفظه.. <span>لا يفوتك!</span><small>التفاصيل كاملة في قناة «بقلم دينا» على واتساب</small></div>
</div>
</body></html>
