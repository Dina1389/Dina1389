<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=block" rel="stylesheet">
<style>
:root{--bg:#FAF4EC;--line:#EADBCD;--ac:#D9775A;--ac2:#A34A2E;--ink:#2B1A12;--soft:#F8E1D6;--mute:#7A6457;--term:#2B1A12}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'Tajawal',sans-serif;font-weight:700;color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background-color:var(--bg);
 background-image:linear-gradient(rgba(163,74,46,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(163,74,46,.05) 2px,transparent 2px);background-size:90px 90px;background-position:-2px 0}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(217,119,90,.08));pointer-events:none}
#hdr{position:absolute;top:120px;right:60px;left:60px;height:100px;display:flex;align-items:center;gap:22px}
.badge{width:88px;height:88px;border-radius:24px;background:var(--ac);display:flex;align-items:center;justify-content:center;color:#fff;font:700 52px "IBM Plex Mono";box-shadow:0 6px 16px rgba(217,119,90,.35)}
.brand{font:800 60px Tajawal;color:var(--ink);display:flex;align-items:flex-start;gap:8px}
.brand sup{font:600 26px "IBM Plex Mono";color:var(--mute);margin-top:2px}
.sep{width:3px;height:66px;background:var(--line);border-radius:2px}
#ttl .en{font-weight:700}
#ttl{font-size:52px;font-weight:800;color:var(--ac2);white-space:nowrap}
#hline{position:absolute;top:250px;left:60px;right:60px;height:3px;background:var(--line);border-radius:2px}
.scene{position:absolute;inset:0;opacity:0}
.a{position:absolute;will-change:transform,opacity}
.shot{border-radius:26px;overflow:hidden;background:var(--term);box-shadow:0 26px 60px rgba(80,40,20,.25)}
.shot .tb{height:52px;display:flex;align-items:center;gap:12px;padding:0 22px;direction:ltr;background:#3A261B}
.shot .tb i{width:16px;height:16px;border-radius:50%;background:#7A5A48}.shot .tb i:first-child{background:var(--ac)}
.shot .tb span{margin-left:auto;font:22px "IBM Plex Mono";color:#C9A38E}
.shot .iw{overflow:hidden;margin:0 6px 6px;border-radius:0 0 20px 20px}
.shot img{display:block;width:100%;transform-origin:50% 50%}
.chip{display:flex;align-items:center;gap:16px;padding:16px 30px;border:3px solid var(--ac);border-radius:20px;background:#fff;font-size:48px;font-weight:800;color:var(--ink);white-space:nowrap;box-shadow:0 10px 24px rgba(110,60,35,.10)}
.chip svg{width:48px;height:48px;color:var(--ac);flex:none}
.chip.fill{background:var(--ac);color:#fff}.chip.fill svg{color:#fff}
.card{border:4px solid var(--ac);border-radius:34px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;box-shadow:0 16px 34px rgba(110,60,35,.12)}
.card svg{width:44%;height:44%;color:var(--ac)}
.card b{font-size:36px;color:var(--ink);font-weight:800}
.num{position:absolute;top:-24px;left:-24px;width:64px;height:64px;border-radius:50%;background:var(--ac2);color:#fff;font:700 38px 'IBM Plex Mono';display:flex;align-items:center;justify-content:center;border:5px solid var(--bg)}
.tag{font-weight:800;padding:8px 30px;border-radius:44px;border:3px solid var(--ac);background:var(--soft);color:var(--ac2);font-size:40px}
.spark{border-radius:28%;background:var(--ac);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(217,119,90,.35)}
.big{color:var(--ac2)}
.ring{position:absolute;border:3px dashed var(--ac);border-radius:50%}
.ctr{left:0;width:1080px;display:flex;justify-content:center}
#cap{position:absolute;top:1480px;left:50px;right:50px;text-align:center;font:800 88px/1.25 Tajawal;color:var(--ink);white-space:nowrap;-webkit-font-smoothing:antialiased}
.en{font-family:'IBM Plex Mono',monospace;font-weight:700;unicode-bidi:isolate;direction:ltr}
#cap .hl{color:var(--ac)}
